<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Astrological Anna — Survey</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/survey.css">
</head>
<body>

  <video class="stars" autoplay muted loop playsinline>
    <source src="stars.mp4">
  </video>

  <!-- Level-map progress rail -->
  <nav class="map">
    <div class="route"></div>
    <i class="node n1 active">1</i>
    <i class="node n2">2</i>
    <i class="node n3">3</i>
    <i class="node n4">4</i>
    <i class="node n5">5</i>
    <em class="lbl n1">astrology</em>
    <em class="lbl n2">movie test</em>
    <em class="lbl n3">swaggy genius</em>
    <em class="lbl n4">height</em>
    <em class="lbl n5">final</em>
  </nav>

  <main class="page">

    <div id="fx" aria-hidden="true"></div>

    <div class="avatar" id="av">
      <img id="anna" src="assets/portrait-cutout.png">
      <img class="steam sL" src="assets/steam-left.png" alt="">
      <img class="steam sR" src="assets/steam-right.png" alt="">
    </div>

    <form class="card">
      <b>BIRTH DATE</b>
      <div class="row">
        <select id="bMonth"></select>
        <select id="bDay"></select>
        <select id="bYear"></select>
      </div>
      <b>BIRTH TIME</b>
      <div class="row">
        <select id="bHour"></select>
        <span class="colon">:</span>
        <input id="bMin" type="number" min="0" max="59" placeholder="mm">
        <div class="ampm">
          <button type="button" id="amBtn">AM</button>
          <button type="button" id="pmBtn" class="on">PM</button>
        </div>
      </div>
      <b>BIRTH LOCATION</b>
      <div class="locwrap">
        <input id="bLoc" placeholder="start typing a city" autocomplete="off">
        <div id="locList"></div>
      </div>
      <button type="button" class="next" id="nextBtn">NEXT →</button>
    </form>

    <!-- Stage 2: the movie test (Blu-ray shelf; cases are built by js/survey.js) -->
    <section id="stage2">
      <header class="shelfHead">
        <b>THE MOVIE TEST</b>
        <span>click every one you've <i>actually</i> seen — Anna can tell when you lie</span>
      </header>
      <div class="shelfRow" id="shelfRow1"></div>
      <div class="shelfRow" id="shelfRow2"></div>
      <footer class="shelfFoot">
        <span class="seen" id="seenCount">0 / 12 seen</span>
        <button type="button" class="next" id="nextBtn2">NEXT →</button>
      </footer>
    </section>

    <div class="betas">
      <div class="anims">
        ANIMATION BETA<br>
        <button type="button" class="on" data-fx="none">none</button>
        <button type="button" data-fx="arrows">⬆ arrows</button>
        <button type="button" data-fx="boom">💥 boom</button>
        <button type="button" data-fx="fire">🔥 fire</button>
        <button type="button" data-fx="waterfall">🌊 waterfall</button>
        <button type="button" data-fx="sparkles">✨ sparkles</button>
      </div>
      <div class="moods">
        EMOTION BETA<br>
        <button type="button" class="on" data-img="portrait-cutout">neutral</button>
        <button type="button" data-img="love">♥ love</button>
        <button type="button" data-img="sad">sad</button>
        <button type="button" data-img="scared">scared</button>
        <button type="button" data-img="angry">😤 angry</button>
      </div>
    </div>

  </main>

  <!-- Compatibility result modal -->
  <div id="overlay">
    <div class="modal">
      <h2>COSMIC COMPATIBILITY</h2>
      <div class="pct" id="mPct"></div>
      <p class="verdict" id="mVerdict"></p>
      <div class="big3" id="mBig3"></div>
      <h3>💖 GREEN FLAGS</h3><ul id="mGreen"></ul>
      <h3>💔 RED FLAGS</h3><ul id="mRed"></ul>
      <p class="fine" id="mFine"></p>
      <button class="closeM" id="closeM">close</button>
    </div>
  </div>

  <script src="assets/astronomy.browser.min.js"></script>
  <script src="assets/synastry.js"></script>
  <script src="js/survey.js"></script>

</body>
</html>
