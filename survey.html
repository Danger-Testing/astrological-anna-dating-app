<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#edfaff}.stars{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}.map{height:160px;position:relative}.route{position:absolute;left:max(4%,52px);right:max(4%,52px);top:62px;height:20px;border-radius:12px;background:linear-gradient(#ffffff,#d9dbe2 45%,#9fa3af);border:2px solid #828692;box-shadow:0 2px 3px rgba(0,0,0,.25)}.node{position:absolute;top:72px;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd9e9,#f772b0 30%,#f14e98 60%,#a81260 85%);border:6px solid #e9ebf2;box-shadow:0 0 0 2px #828692,0 2px 4px rgba(0,0,0,.3),inset 0 -4px 8px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:22px;text-shadow:0 2px 3px rgba(0,0,0,.6)}.node.active{transform:translate(-50%,-50%) scale(1.18);box-shadow:0 0 0 2px #828692,0 0 14px 5px rgba(241,78,152,.85),0 2px 4px rgba(0,0,0,.3),inset 0 -4px 8px rgba(0,0,0,.35)}.lbl{position:absolute;top:112px;transform:translateX(-50%);font-weight:bold;font-size:14px;letter-spacing:1px;text-transform:uppercase;color:#fff;text-shadow:0 1px 0 #a81260,0 2px 4px rgba(0,0,0,.45);white-space:nowrap}.lbl.n1{left:1%;transform:none}.lbl.n5{left:auto;right:1%;transform:none}.n1{left:max(4%,52px)}.n2{left:27%}.n3{left:50%}.n4{left:73%}.n5{left:calc(100% - max(4%,52px))}.page{height:calc(100vh - 160px);position:relative}.avatar{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:78vh}.avatar img{height:100%;object-fit:contain}.card{position:absolute;right:7%;top:14%;width:280px;padding:17px;background:#ffd9e9;border:3px solid #f14e98;border-radius:18px}.card input{width:100%;padding:10px;margin:5px 0 13px;border:2px solid #f7a8cc;border-radius:8px}.card button{width:100%;padding:13px;background:#f14e98;color:white;border:0;border-radius:10px;font-weight:bold}.moods{position:absolute;left:5%;bottom:5%;padding:12px;background:#ffd9e9;border:3px solid #f14e98;border-radius:15px}.moods button{margin:3px;border-radius:7px;border:2px solid #f14e98;background:white;padding:7px;cursor:pointer}.moods button.on{background:#f14e98;color:#fff}</style><video class="stars" autoplay muted loop playsinline><source src="stars.mp4"></video><nav class="map"><div class="route"></div><i class="node n1 active">1</i><i class="node n2">2</i><i class="node n3">3</i><i class="node n4">4</i><i class="node n5">5</i><em class="lbl n1">astrology</em><em class="lbl n2">book test</em><em class="lbl n3">swaggy genius</em><em class="lbl n4">height</em><em class="lbl n5">final</em></nav><main class="page"><div class="avatar"><img id="anna" src="assets/portrait-cutout.png"></div><form class="card"><b>BIRTH DATE</b><input placeholder="MM / DD / YYYY"><b>BIRTH TIME</b><input placeholder="HH:MM AM / PM"><b>BIRTH LOCATION</b><input placeholder="start typing a city"><button>NEXT →</button></form><div class="moods">EMOTION BETA<br><button type="button" class="on" data-img="portrait-cutout">neutral</button><button type="button" data-img="love">♥ love</button><button type="button" data-img="sad">sad</button><button type="button" data-img="scared">scared</button></div></main><script>document.querySelectorAll('.moods button').forEach(b=>b.addEventListener('click',()=>{document.getElementById('anna').src='assets/'+b.dataset.img+'.png';document.querySelectorAll('.moods button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}))</script>
