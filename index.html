<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#edfaff}.stars{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}.map{height:130px;position:relative}.route{position:absolute;left:4%;right:4%;top:50%;transform:translateY(-50%);height:20px;border-radius:12px;background:linear-gradient(#fff9a8,#ffe600 45%,#d9b800);border:2px solid #b89a00;box-shadow:0 2px 3px rgba(0,0,0,.25)}.node{position:absolute;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c8d2ff,#6b6bf5 30%,#3327d6 60%,#1c128f 85%);border:6px solid #ffe600;box-shadow:0 0 0 2px #b89a00,0 2px 4px rgba(0,0,0,.3),inset 0 -4px 8px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:22px;text-shadow:0 2px 3px rgba(0,0,0,.6)}.node.active{transform:translate(-50%,-50%) scale(1.18);box-shadow:0 0 0 2px #b89a00,0 0 14px 4px rgba(255,230,0,.9),0 2px 4px rgba(0,0,0,.3),inset 0 -4px 8px rgba(0,0,0,.35)}.n1{left:4%}.n2{left:27%}.n3{left:50%}.n4{left:73%}.n5{left:96%}.page{height:calc(100vh - 130px);position:relative}.avatar{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:78vh}.avatar img{height:100%;object-fit:contain}.card{position:absolute;right:7%;top:14%;width:280px;padding:17px;background:#d9eff4;border:3px solid #354056;border-radius:18px}.card input{width:100%;padding:10px;margin:5px 0 13px}.card button{width:100%;padding:13px;background:#e83b61;color:white;border:0;border-radius:10px;font-weight:bold}.moods{position:absolute;left:5%;bottom:5%;padding:12px;background:#ffd9e9;border:3px solid #f14e98;border-radius:15px}.moods button{margin:3px;border-radius:7px;border:2px solid #f14e98;background:white;padding:7px}</style><video class="stars" autoplay muted loop playsinline><source src="stars.mp4"></video><nav class="map"><div class="route"></div><i class="node n1 active">1</i><i class="node n2">2</i><i class="node n3">3</i><i class="node n4">4</i><i class="node n5">5</i></nav><main class="page"><div class="avatar"><img src="assets/portrait-cutout.png"></div><form class="card"><b>BIRTH DATE</b><input placeholder="MM / DD / YYYY"><b>BIRTH TIME</b><input placeholder="HH:MM AM / PM"><b>BIRTH LOCATION</b><input placeholder="start typing a city"><button>NEXT →</button></form><div class="moods">EMOTION BETA<br><button>neutral</button><button>♥ love</button><button>sad</button><button>scared</button></div></main>
